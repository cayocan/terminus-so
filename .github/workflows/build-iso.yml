name: build-iso

on:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "!iso/testar-vm.ps1"
      - "shell/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y live-build git ca-certificates

      - uses: actions/checkout@v4

      - name: Gerar ISO
        run: |
          chmod +x iso/build.sh iso/auto/* iso/config/hooks/normal/*
          ./iso/build.sh

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: terminus-so-iso
          path: iso/*.iso
          retention-days: 14
