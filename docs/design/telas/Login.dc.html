<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Terminus SO — Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#04070D}
a{color:#7FD8EA}a:hover{color:#B9EEF7}
.glass-btn:hover{background:rgba(255,255,255,0.08)}
input::placeholder{color:#7E9DB3}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #04070D; font-family: Inter, system-ui, sans-serif; color: #E6F4FB">

<svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0">
<defs>
<radialGradient id="lgGlow" cx="50%" cy="52%" r="42%">
<stop offset="0%" stop-color="#1E6BFF" stop-opacity="0.2"></stop>
<stop offset="60%" stop-color="#1E6BFF" stop-opacity="0.04"></stop>
<stop offset="100%" stop-color="#04070D" stop-opacity="0"></stop>
</radialGradient>
<pattern id="lgGrid" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M48 0H0V48" fill="none" stroke="#9CC9E0" stroke-opacity="0.04" stroke-width="1"></path>
</pattern>
</defs>
<rect width="1920" height="1080" fill="url(#lgGrid)"></rect>
<rect width="1920" height="1080" fill="url(#lgGlow)"></rect>
</svg>

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; padding-top: 72px; box-sizing: border-box">
<div style="font-family: Orbitron, sans-serif; font-size: 112px; font-weight: 600; letter-spacing: 4px; line-height: 1; color: #F2FAFF">07:40</div>
<div style="margin-top: 14px; font-size: 22px; color: #A9C7DA">quinta-feira, 22 de outubro</div>

<div style="margin-top: 36px; width: 380px; height: 380px">
<dc-import name="Esfera" size="{{ 380 }}" estado="repouso" uid="lg" hint-size="380px,380px"></dc-import>
</div>

<div style="margin-top: 8px; font-family: Orbitron, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 3px">[SEU NOME]</div>

<form style="margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<label for="senha" style="font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #8FB3CC">Senha</label>
<div style="display: flex; align-items: center; gap: 10px">
<input id="senha" type="password" placeholder="Digite sua senha" style="width: 320px; height: 52px; box-sizing: border-box; padding: 0 20px; border-radius: 26px; border: 1px solid rgba(34,211,238,0.4); background: rgba(10,22,38,0.7); color: #EAF6FC; font-family: Inter, sans-serif; font-size: 16px; outline: none">
<button type="submit" aria-label="Entrar" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.55); background: rgba(34,211,238,0.16); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</form>

<div style="margin-top: 20px; display: flex; align-items: center; gap: 10px; color: #A9C7DA; font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
<span>Ao ligar o PC, a senha é obrigatória. Na tela de bloqueio, basta dizer “[palavra de ativação]”.</span>
</div>
</div>

<div style="position: absolute; right: 48px; bottom: 40px; display: flex; gap: 10px">
<button class="glass-btn" aria-label="Idioma: português" style="height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid rgba(156,201,224,0.25); background: transparent; color: #CFE6F2; font-family: Inter, sans-serif; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>
PT
</button>
<button class="glass-btn" aria-label="Reiniciar" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(156,201,224,0.25); background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
</button>
<button class="glass-btn" aria-label="Desligar" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(156,201,224,0.25); background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
