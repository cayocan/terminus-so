<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esfera de energia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; background: transparent">
<svg role="img" aria-label="{{label}}" width="{{size}}" height="{{size}}" viewBox="0 0 520 520">
<defs>
<filter id="{{ids.glow}}" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="2.6" result="b"></feGaussianBlur>
<feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
<filter id="{{ids.soft}}" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="16"></feGaussianBlur>
</filter>
<filter id="{{ids.spark}}" x="-200%" y="-200%" width="500%" height="500%">
<feGaussianBlur stdDeviation="3"></feGaussianBlur>
</filter>
<radialGradient id="{{ids.halo}}" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="{{c.accent}}" stop-opacity="0.16"></stop>
<stop offset="45%" stop-color="{{c.deep}}" stop-opacity="0.07"></stop>
<stop offset="100%" stop-color="{{c.deep}}" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="{{ids.heart}}" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="{{c.accent}}" stop-opacity="{{s.heart}}"></stop>
<stop offset="60%" stop-color="{{c.deep}}" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="{{c.deep}}" stop-opacity="0"></stop>
</radialGradient>
</defs>
<circle cx="260" cy="260" r="250" fill="url(#{{ids.halo}})"></circle>
<circle cx="260" cy="260" r="150" fill="none" stroke="{{c.accent}}" stroke-width="1">
<animate attributeName="r" values="150;245" dur="{{s.waveDur}}" repeatCount="indefinite"></animate>
<animate attributeName="stroke-opacity" values="{{s.waveOp}};0" dur="{{s.waveDur}}" repeatCount="indefinite"></animate>
</circle>
<circle cx="260" cy="260" r="150" fill="none" stroke="{{c.accent}}" stroke-width="1">
<animate attributeName="r" values="150;245" dur="{{s.waveDur}}" begin="{{s.waveBegin}}" repeatCount="indefinite"></animate>
<animate attributeName="stroke-opacity" values="{{s.waveOp}};0" dur="{{s.waveDur}}" begin="{{s.waveBegin}}" repeatCount="indefinite"></animate>
</circle>
<circle cx="260" cy="260" r="80" fill="url(#{{ids.heart}})" filter="url(#{{ids.soft}})">
<animate attributeName="r" values="{{s.breath}}" dur="{{s.breathDur}}" repeatCount="indefinite"></animate>
</circle>
<g filter="url(#{{ids.glow}})" fill="none" stroke-linecap="round" stroke-linejoin="round">
<sc-for list="{{filaments}}" as="f" hint-placeholder-count="9">
<g>
<path d="{{f.dA}}" stroke="{{f.stroke}}" stroke-opacity="{{f.o}}" stroke-width="{{f.w}}">
<animate attributeName="d" values="{{f.morph}}" dur="{{f.morphDur}}" repeatCount="indefinite"></animate>
</path>
<animateTransform attributeName="transform" type="rotate" from="{{f.from}}" to="{{f.to}}" dur="{{f.rotDur}}" repeatCount="indefinite"></animateTransform>
</g>
</sc-for>
</g>
<sc-if value="{{s.ring}}" hint-placeholder-val="{{ false }}">
<g filter="url(#{{ids.glow}})">
<circle cx="260" cy="260" r="215" fill="none" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="2" stroke-dasharray="6 14"></circle>
<animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="8s" repeatCount="indefinite"></animateTransform>
</g>
</sc-if>
<g filter="url(#{{ids.glow}})">
<sc-for list="{{particles}}" as="p" hint-placeholder-count="34">
<circle cx="{{p.x}}" cy="{{p.y}}" r="{{p.r}}" fill="{{p.fill}}">
<animate attributeName="opacity" values="{{p.flicker}}" dur="{{p.dur}}" repeatCount="indefinite"></animate>
</circle>
</sc-for>
<animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="{{s.spin}}" repeatCount="indefinite"></animateTransform>
</g>
<g filter="url(#{{ids.glow}})">
<sc-for list="{{particles2}}" as="p" hint-placeholder-count="22">
<circle cx="{{p.x}}" cy="{{p.y}}" r="{{p.r}}" fill="{{p.fill}}">
<animate attributeName="opacity" values="{{p.flicker}}" dur="{{p.dur}}" repeatCount="indefinite"></animate>
</circle>
</sc-for>
<animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="{{s.spin2}}" repeatCount="indefinite"></animateTransform>
</g>
<circle cx="260" cy="260" r="7" fill="#FFFFFF" filter="url(#{{ids.spark}})">
<animate attributeName="fill-opacity" values="0.5;0.95;0.5" dur="{{s.breathDur}}" repeatCount="indefinite"></animate>
</circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":520,"min":120,"max":900},"estado":{"editor":"enum","options":["repouso","escutando","pensando","falando","programando","atencao","erro"],"default":"repouso"},"preset":{"editor":"enum","options":["Jarvis clássico","Mark","Stealth"],"default":"Jarvis clássico"},"uid":{"editor":null,"default":"esf"},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var presets = {
      'Jarvis clássico': { accent: '#22D3EE', deep: '#1E6BFF' },
      'Mark': { accent: '#F5B83D', deep: '#E5484D' },
      'Stealth': { accent: '#D6DEE6', deep: '#6B7A8C' }
    };
    var states = {
      repouso: { ampK: 0.55, morphK: 1.8, rotK: 1.6, opK: 0.7, waveDur: '7s', waveBegin: '3.5s', waveOp: '0.22', heart: '0.32', breath: '66;84;66', breathDur: '6s', count: 30, spin: '120s', spin2: '70s', ring: false, label: 'Esfera de energia em repouso' },
      escutando: { ampK: 1.5, morphK: 0.3, rotK: 0.8, opK: 1, waveDur: '1.6s', waveBegin: '0.8s', waveOp: '0.6', heart: '0.6', breath: '66;96;66', breathDur: '1.2s', count: 50, spin: '50s', spin2: '30s', ring: false, label: 'Esfera de energia escutando' },
      pensando: { ampK: 1, morphK: 0.8, rotK: 0.15, opK: 0.9, waveDur: '5s', waveBegin: '2.5s', waveOp: '0.3', heart: '0.45', breath: '72;84;72', breathDur: '2s', count: 60, spin: '4s', spin2: '6s', ring: false, label: 'Esfera de energia pensando' },
      falando: { ampK: 1.8, morphK: 0.18, rotK: 0.6, opK: 1, waveDur: '2.4s', waveBegin: '1.2s', waveOp: '0.55', heart: '0.7', breath: '66;100;66', breathDur: '0.7s', count: 56, spin: '40s', spin2: '24s', ring: false, label: 'Esfera de energia falando' },
      programando: { ampK: 0.9, morphK: 0.9, rotK: 0.4, opK: 0.85, waveDur: '6s', waveBegin: '3s', waveOp: '0.25', heart: '0.4', breath: '72;84;72', breathDur: '3s', count: 50, spin: '40s', spin2: '24s', ring: true, label: 'Esfera de energia com a IA de programação trabalhando' },
      atencao: { ampK: 1.2, morphK: 0.5, rotK: 1, opK: 0.95, waveDur: '2.2s', waveBegin: '1.1s', waveOp: '0.5', heart: '0.55', breath: '66;92;66', breathDur: '2.2s', count: 50, spin: '40s', spin2: '24s', ring: false, label: 'Esfera de energia em alerta de atenção', accent: '#F5A54A', deep: '#C2611F' },
      erro: { ampK: 1.6, morphK: 0.25, rotK: 0.9, opK: 1, waveDur: '1.2s', waveBegin: '0.6s', waveOp: '0.7', heart: '0.6', breath: '62;98;62', breathDur: '1.2s', count: 50, spin: '40s', spin2: '24s', ring: false, label: 'Esfera de energia indicando erro', accent: '#F05252', deep: '#A42828' }
    };
    var s = states[this.props.estado] || states.repouso;
    var base = presets[this.props.preset] || presets['Jarvis clássico'];
    var c = { accent: s.accent || base.accent, deep: s.deep || base.deep };
    var size = this.props.size ?? 520;
    var uid = this.props.uid ?? 'esf';
    var cx = 260;
    var specs = [
      [150, 10, 5, 0, 'a', 0.9, 1.6, 40, 6, 1],
      [146, 14, 3, 1, 'd', 0.85, 2.2, 55, 8, -1],
      [156, 8, 7, 2, 'w', 0.45, 1, 30, 5, 1],
      [138, 12, 4, 3, 'a', 0.6, 1.2, 70, 9, -1],
      [162, 6, 6, 4, 'd', 0.55, 1, 45, 7, 1],
      [130, 16, 5, 5, 'a', 0.4, 1, 35, 10, -1],
      [120, 10, 3, 0.5, 'w', 0.3, 0.8, 80, 6.5, 1],
      [105, 12, 6, 2.5, 'a', 0.35, 1, 25, 5.5, -1],
      [90, 14, 4, 1.5, 'd', 0.3, 1, 50, 8.5, 1]
    ];
    var self = this;
    var filaments = specs.map(function (sp) { return self.filament(cx, sp, c, s); });
    var makeParticles = function (count, seed, rMin, rSpan) {
      var list = [];
      for (var i = 0; i < count; i++) {
        var j = i + seed;
        var ang = j * 2.399;
        var rad = rMin + (j * 53) % rSpan;
        list.push({
          x: (cx + rad * Math.cos(ang)).toFixed(1),
          y: (cx + rad * Math.sin(ang)).toFixed(1),
          r: (0.8 + (j % 4) * 0.5).toFixed(1),
          fill: j % 3 === 0 ? '#EAF8FF' : (j % 3 === 1 ? c.accent : c.deep),
          flicker: j % 2 ? '0.85;0.1;0.85' : '0.1;0.9;0.1',
          dur: (1.8 + (j % 6) * 0.6).toFixed(1) + 's'
        });
      }
      return list;
    };
    var n1 = Math.round(s.count * 0.6);
    return {
      size: size,
      px: size + 'px',
      label: s.label,
      c: c,
      s: s,
      ids: { glow: uid + '-glow', soft: uid + '-soft', spark: uid + '-spark', halo: uid + '-halo', heart: uid + '-heart' },
      filaments: filaments,
      particles: makeParticles(n1, 0, 70, 170),
      particles2: makeParticles(s.count - n1, 7, 40, 200)
    };
  }
  wave(cx, R, amp, k, ph) {
    var n = 96, d = '';
    for (var i = 0; i <= n; i++) {
      var t = i / n * Math.PI * 2;
      var r = R + amp * Math.sin(k * t + ph) + amp * 0.4 * Math.sin((k + 2) * t - ph * 1.3);
      d += (i ? 'L' : 'M') + (cx + r * Math.cos(t)).toFixed(1) + ' ' + (cx + r * Math.sin(t)).toFixed(1);
    }
    return d + 'Z';
  }
  filament(cx, sp, c, s) {
    var stroke = sp[4] === 'a' ? c.accent : (sp[4] === 'd' ? c.deep : '#EAF8FF');
    var amp = sp[1] * s.ampK;
    var dA = this.wave(cx, sp[0], amp, sp[2], sp[3]);
    var dB = this.wave(cx, sp[0], amp * 0.55, sp[2], sp[3] + Math.PI);
    var fwd = sp[9] > 0;
    return {
      dA: dA,
      morph: dA + ';' + dB + ';' + dA,
      stroke: stroke,
      o: Math.min(1, sp[5] * s.opK).toFixed(2),
      w: sp[6],
      rotDur: (sp[7] * s.rotK).toFixed(1) + 's',
      morphDur: (sp[8] * s.morphK).toFixed(2) + 's',
      from: (fwd ? '0 ' : '360 ') + cx + ' ' + cx,
      to: (fwd ? '360 ' : '0 ') + cx + ' ' + cx
    };
  }
}
</script>
</body>
</html>
