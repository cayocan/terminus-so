<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Terminus SO — Dock e áreas de atalho em ação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#04070D}
a{color:#7FD8EA}a:hover{color:#B9EEF7}
.fan-item:hover{transform:translateX(-4px)}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #04070D; font-family: Inter, system-ui, sans-serif; color: #E6F4FB">

<svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0">
<defs>
<pattern id="adGrid" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M48 0H0V48" fill="none" stroke="#9CC9E0" stroke-opacity="0.045" stroke-width="1"></path>
</pattern>
<radialGradient id="adGlow" cx="50%" cy="40%" r="45%">
<stop offset="0%" stop-color="#1E6BFF" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#04070D" stop-opacity="0"></stop>
</radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#adGrid)"></rect>
<rect width="1920" height="1080" fill="url(#adGlow)"></rect>
</svg>

<div style="position: absolute; left: 770px; top: 150px; width: 380px; height: 380px">
<dc-import name="Esfera" size="{{ 380 }}" estado="escutando" uid="ad" hint-size="380px,380px"></dc-import>
</div>
<div style="position: absolute; left: 50%; top: 548px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="font-family: Orbitron, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 5px; color: #22D3EE">ESCUTANDO</span>
<span style="font-size: 22px; color: #EAF6FC">“Aumenta a área de jogos”</span>
</div>

<div aria-hidden="true" style="position: absolute; left: 1336px; top: 120px; width: 520px; height: 320px; box-sizing: border-box; border-radius: 24px; border: 1.5px dashed rgba(34,211,238,0.6)"></div>
<section aria-label="Área de atalhos Jogos, sendo redimensionada" style="position: absolute; left: 1436px; top: 120px; width: 420px; height: 236px; box-sizing: border-box; padding: 20px 22px; border-radius: 22px; background: rgba(10,22,38,0.62); border: 1.5px solid #22D3EE; box-shadow: 0 0 30px rgba(34,211,238,0.18); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: Orbitron, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 2.5px; color: #22D3EE">JOGOS</span>
<span style="font-size: 12px; color: #8FB3CC">8 atalhos</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{games}}" as="g" hint-placeholder-count="4">
<a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #CFE6F2">
<span style="width: 60px; height: 60px; border-radius: 18px; background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.28); display: flex; align-items: center; justify-content: center; color: #22D3EE">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg>
</span>
<span style="font-size: 13px; text-align: center">{{g.name}}</span>
</a>
</sc-for>
</div>
<span aria-hidden="true" style="position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 4px; background: #04070D; border: 2px solid #22D3EE"></span>
<span aria-hidden="true" style="position: absolute; left: -7px; bottom: -7px; width: 14px; height: 14px; border-radius: 4px; background: #22D3EE; border: 2px solid #22D3EE"></span>
<span aria-hidden="true" style="position: absolute; right: -7px; top: -7px; width: 14px; height: 14px; border-radius: 4px; background: #04070D; border: 2px solid #22D3EE"></span>
<span aria-hidden="true" style="position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px; border-radius: 4px; background: #04070D; border: 2px solid #22D3EE"></span>
</section>
<div style="position: absolute; left: 1336px; top: 452px; height: 32px; padding: 0 12px; border-radius: 10px; background: rgba(34,211,238,0.16); color: #7FE3F3; font-family: Orbitron, sans-serif; font-size: 13px; display: flex; align-items: center">520 × 320</div>

<section aria-label="Áreas minimizadas" style="position: absolute; left: 64px; top: 120px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Abrir área Trabalho" style="width: 72px; height: 72px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.28); background: rgba(10,22,38,0.62); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 0 18px rgba(34,211,238,0.12)">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Trabalho</span>
<span style="font-size: 13px; color: #8FB3CC">minimizada · 6 atalhos</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button aria-label="Abrir área Estudos" style="width: 72px; height: 72px; border-radius: 50%; border: 1px solid rgba(34,211,238,0.28); background: rgba(10,22,38,0.62); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 0 18px rgba(34,211,238,0.12)">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Estudos</span>
<span style="font-size: 13px; color: #8FB3CC">minimizada · 4 atalhos</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="width: 72px; height: 72px; position: relative">
<span style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(34,211,238,0.6)"></span>
<span style="position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(34,211,238,0.18); box-shadow: 0 0 24px rgba(34,211,238,0.5)"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Música</span>
<span style="font-size: 13px; color: #7FE3F3">desdobrando…</span>
</div>
</div>
</section>

<div style="position: absolute; left: 64px; bottom: 140px; width: 360px; box-sizing: border-box; padding: 16px 18px; border-radius: 16px; background: rgba(10,22,38,0.6); border: 1px solid rgba(156,201,224,0.16); display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #8FB3CC">Comandos de voz</span>
<span style="font-size: 14px; color: #CFE6F2">“Cria uma área de estudos com o navegador”</span>
<span style="font-size: 14px; color: #CFE6F2">“Minimiza a área de trabalho”</span>
<span style="font-size: 14px; color: #CFE6F2">“Organiza as áreas”</span>
</div>

<nav aria-label="Dock" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); height: 92px; box-sizing: border-box; padding: 0 18px 12px; border-radius: 28px; background: rgba(12,24,40,0.72); border: 1px solid rgba(34,211,238,0.28); display: flex; align-items: flex-end; gap: 14px">
<sc-for list="{{dock}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button aria-label="{{d.name}}" style="width: {{d.size}}; height: {{d.size}}; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.12); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: {{d.lift}}">
<svg aria-hidden="true" width="{{d.icon}}" height="{{d.icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.path}}"></path></svg>
</button>
<span style="width: 5px; height: 5px; border-radius: 50%; background: {{d.dot}}"></span>
</div>
</sc-for>
<div aria-hidden="true" style="width: 1px; height: 56px; align-self: center; margin-bottom: 10px; background: rgba(34,211,238,0.28)"></div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
<ul aria-label="Conteúdo de Downloads" style="position: absolute; bottom: 96px; left: 50%; margin: 0; padding: 0; list-style: none; width: 0; height: 0">
<sc-for list="{{fan}}" as="f" hint-placeholder-count="5">
<li style="position: absolute; bottom: {{f.bottom}}; right: {{f.right}}; transform: rotate({{f.rot}}); display: flex; align-items: center; gap: 12px">
<span style="white-space: nowrap; height: 30px; padding: 0 12px; border-radius: 10px; background: rgba(9,18,32,0.92); border: 1px solid rgba(156,201,224,0.2); font-size: 13px; color: #EAF6FC; display: flex; align-items: center">{{f.name}}</span>
<a class="fan-item" href="#" aria-label="{{f.name}}" style="width: 52px; height: 52px; border-radius: 14px; background: rgba(12,28,46,0.95); border: 1px solid rgba(34,211,238,0.35); color: {{f.tint}}; display: flex; align-items: center; justify-content: center; transition: transform .15s ease">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon}}"></path></svg>
</a>
</li>
</sc-for>
</ul>
<button aria-label="Pasta Downloads, aberta em leque" aria-expanded="true" style="width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid #22D3EE; background: rgba(34,211,238,0.2); color: #EAFBFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"></path><path d="M4 19h16"></path></svg>
</button>
<span style="width: 5px; height: 5px"></span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button aria-label="Lixeira" style="width: 60px; height: 60px; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(255,255,255,0.04); color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
</button>
<span style="width: 5px; height: 5px"></span>
</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
      web: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18',
      term: 'M3 4h18v16H3zM7 9l3 3-3 3M13 15h4',
      cube: 'M12 2 21 7v10l-9 5-9-5V7zM12 22V12M21 7l-9 5-9-5',
      game: 'M6 11h4M8 9v4M7 5h10a5 5 0 0 1 5 5v1.5a4.5 4.5 0 0 1-8.2 2.6L13 13h-2l-.8 1.1A4.5 4.5 0 0 1 2 11.5V10a5 5 0 0 1 5-5z',
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1',
      ball: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18M3 12h18',
      flask: 'M10 2h4M11 2v5L6 17a3 3 0 0 0 2.7 4.3h6.6A3 3 0 0 0 18 17l-5-10V2M7.5 14h9',
      doc: 'M7 3h7l5 5v13H7zM14 3v5h5',
      img: 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4',
      zip: 'M7 3h10v18H7zM12 3v2M12 7v2M12 11v2',
      pkg: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10'
    };
    var dockRaw = [
      ['Pastas', P.folder, true, false], ['Busca', P.search, false, false], ['Navegador web', P.web, true, false],
      ['Terminal', P.term, false, true], ['Unity Hub', P.cube, true, false], ['Steam', P.game, false, false], ['Configurações', P.gear, false, false]
    ];
    var dock = dockRaw.map(function (d) {
      var big = d[3];
      return { name: d[0], path: d[1], dot: d[2] ? '#22D3EE' : 'transparent', size: big ? '78px' : '60px', icon: big ? 36 : 28, lift: big ? '-18px' : '0px' };
    });
    var games = [
      { name: 'Steam', icon: P.game },
      { name: 'Rocket League', icon: P.ball },
      { name: 'Bottles', icon: P.flask },
      { name: 'Pasta Jogos', icon: P.folder }
    ];
    var fanRaw = [
      ['instalador-unity.deb', P.pkg, '#5B9BFF'],
      ['texturas-pack.zip', P.zip, '#A9C7DA'],
      ['referencia-hud.png', P.img, '#22D3EE'],
      ['contrato-freela.pdf', P.doc, '#A9C7DA'],
      ['trilha-menu.ogg', P.folder, '#22D3EE']
    ];
    var fan = fanRaw.map(function (f, i) {
      return { name: f[0], icon: f[1], tint: f[2], bottom: (i * 62) + 'px', right: (-30 - i * i * 4) + 'px', rot: (-2 - i * 2.2) + 'deg' };
    });
    return { dock: dock, games: games, fan: fan };
  }
}
</script>
</body>
</html>
