<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Terminus SO — Navegador de pastas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#04070D}
a{color:#7FD8EA}a:hover{color:#B9EEF7}
.win-btn:hover{background:rgba(255,255,255,0.08)}
.win-close:hover{background:#C4314B;color:#FFFFFF}
.side-link:hover{background:rgba(255,255,255,0.05)}
.tile:hover{background:rgba(34,211,238,0.08)}
input::placeholder{color:#7E9DB3}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #04070D; font-family: Inter, system-ui, sans-serif; color: #E6F4FB">

<svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0">
<defs>
<pattern id="psGrid" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M48 0H0V48" fill="none" stroke="#9CC9E0" stroke-opacity="0.045" stroke-width="1"></path>
</pattern>
<radialGradient id="psGlow" cx="50%" cy="42%" r="45%">
<stop offset="0%" stop-color="#1E6BFF" stop-opacity="0.16"></stop>
<stop offset="100%" stop-color="#04070D" stop-opacity="0"></stop>
</radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#psGrid)"></rect>
<rect width="1920" height="1080" fill="url(#psGlow)"></rect>
</svg>

<div aria-label="Esfera minimizada" style="position: absolute; right: 36px; top: 28px; width: 96px; height: 96px">
<dc-import name="Esfera" size="{{ 96 }}" uid="ps" hint-size="96px,96px"></dc-import>
</div>

<section aria-label="Janela Pastas" style="position: absolute; left: 240px; top: 80px; width: 1440px; height: 820px; box-sizing: border-box; border-radius: 18px; background: rgba(9,18,32,0.94); border: 1px solid rgba(34,211,238,0.3); box-shadow: 0 30px 80px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column">

<header style="height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding-left: 20px; border-bottom: 1px solid rgba(156,201,224,0.12)">
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="font-size: 14px; font-weight: 600">Pastas</span>
</div>
<div style="display: flex; height: 52px">
<button class="win-btn" aria-label="Minimizar janela" style="width: 56px; height: 52px; border: none; background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
<button class="win-btn" aria-label="Maximizar janela" style="width: 56px; height: 52px; border: none; background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
<button class="win-close" aria-label="Fechar janela" style="width: 56px; height: 52px; border: none; background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</header>

<div style="height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid rgba(156,201,224,0.12)">
<button class="win-btn" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: #CFE6F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button class="win-btn" aria-label="Avançar" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: #6F8BA0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
<nav aria-label="Caminho" style="flex: 1; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(156,201,224,0.14); display: flex; align-items: center; gap: 8px; font-size: 14px">
<a href="#" style="color: #A9C7DA; text-decoration: none">Início</a><span style="color: #6F8BA0">›</span>
<a href="#" style="color: #A9C7DA; text-decoration: none">Projetos</a><span style="color: #6F8BA0">›</span>
<span style="color: #EAF6FC; font-weight: 600">Unity</span>
</nav>
<div role="group" aria-label="Modo de visualização" style="display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(156,201,224,0.14)">
<button aria-label="Ícones" aria-pressed="true" style="width: 44px; height: 38px; border-radius: 9px; border: none; background: rgba(34,211,238,0.18); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></button>
<button aria-label="Lista" aria-pressed="false" style="width: 44px; height: 38px; border-radius: 9px; border: none; background: transparent; color: #A9C7DA; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
<button aria-label="Colunas" aria-pressed="false" style="width: 44px; height: 38px; border-radius: 9px; border: none; background: transparent; color: #A9C7DA; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16M15 4v16"></path></svg></button>
</div>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 1px; width: 1px; height: 1px; overflow: hidden">Buscar nesta pasta</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FB3CC" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<input type="search" placeholder="Buscar em Unity" style="width: 260px; height: 44px; box-sizing: border-box; padding: 0 14px 0 40px; border-radius: 12px; border: 1px solid rgba(156,201,224,0.2); background: rgba(255,255,255,0.04); color: #EAF6FC; font-family: Inter, sans-serif; font-size: 14px; outline: none">
</label>
</div>

<div style="flex: 1; min-height: 0; display: flex">
<nav aria-label="Barra lateral" style="width: 260px; flex: none; box-sizing: border-box; padding: 18px 12px; border-right: 1px solid rgba(156,201,224,0.12); display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #8FB3CC">Favoritos</span>
<sc-for list="{{fav}}" as="f" hint-placeholder-count="5">
<a class="side-link" href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; color: {{f.color}}; background: {{f.bg}}">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon}}"></path></svg>
{{f.name}}
</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #8FB3CC">Locais</span>
<sc-for list="{{places}}" as="f" hint-placeholder-count="3">
<a class="side-link" href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; color: #CFE6F2">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon}}"></path></svg>
<span style="flex: 1">{{f.name}}</span>
<span style="font-size: 12px; color: #8FB3CC">{{f.note}}</span>
</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #8FB3CC">Áreas</span>
<a class="side-link" href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; color: #CFE6F2"><span style="width: 10px; height: 10px; border-radius: 50%; background: #22D3EE"></span>Jogos</a>
<a class="side-link" href="#" style="height: 40px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; color: #CFE6F2"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1E6BFF"></span>Trabalho</a>
</div>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="flex: 1; box-sizing: border-box; padding: 24px 28px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 150px; gap: 12px; align-content: start">
<sc-for list="{{items}}" as="it" hint-placeholder-count="10">
<a class="tile" href="#" style="border-radius: 16px; border: 1px solid {{it.border}}; background: {{it.bg}}; text-decoration: none; color: #EAF6FC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px">
<span style="width: 64px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: {{it.tint}}; background: {{it.iconBg}}">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
</span>
<span style="font-size: 14px; text-align: center; line-height: 1.3">{{it.name}}</span>
<span style="font-size: 12px; color: #8FB3CC">{{it.meta}}</span>
</a>
</sc-for>
</div>
<footer style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-top: 1px solid rgba(156,201,224,0.12); font-size: 13px; color: #8FB3CC">
<span>10 itens · 1 selecionado</span>
<span>Disco do sistema: 212 GB livres</span>
</footer>
</div>
</div>
</section>

<nav aria-label="Dock" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); height: 80px; box-sizing: border-box; padding: 0 16px 10px; border-radius: 26px; background: rgba(12,24,40,0.72); border: 1px solid rgba(34,211,238,0.28); display: flex; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button aria-label="Pastas, aberto" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.12); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
<span style="width: 5px; height: 5px; border-radius: 50%; background: #22D3EE"></span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button aria-label="Busca" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.12); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>
<span style="width: 5px; height: 5px"></span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button aria-label="Unity Hub" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.12); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"></path><path d="M12 22V12M21 7l-9 5-9-5"></path></svg></button>
<span style="width: 5px; height: 5px"></span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button aria-label="Configurações" style="width: 56px; height: 56px; border-radius: 16px; border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.12); color: #22D3EE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></button>
<span style="width: 5px; height: 5px"></span>
</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var FOLDER = 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';
    var HOME = 'M3 11 12 4l9 7M5 10v10h14V10';
    var DOC = 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6';
    var DOWN = 'M12 4v11M7 10l5 5 5-5M4 19h16';
    var GAME = 'M6 11h4M8 9v4M7 5h10a5 5 0 0 1 5 5v1.5a4.5 4.5 0 0 1-8.2 2.6L13 13h-2l-.8 1.1A4.5 4.5 0 0 1 2 11.5V10a5 5 0 0 1 5-5z';
    var CUBE = 'M12 2 21 7v10l-9 5-9-5V7zM12 22V12M21 7l-9 5-9-5';
    var DISK = 'M3 13h18v6H3zM5 13l2-8h10l2 8M7 16h.01';
    var USB = 'M9 2h6v6H9zM7 8h10v10a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z';
    var WIN = 'M3 5h18v12H3zM8 21h8M12 17v4';
    var IMG = 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M15 9h.01';
    var AUDIO = 'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z';
    var fav = [
      { name: 'Início', icon: HOME },
      { name: 'Documentos', icon: DOC },
      { name: 'Downloads', icon: DOWN },
      { name: 'Projetos', icon: FOLDER, active: true },
      { name: 'Jogos', icon: GAME }
    ].map(function (f) {
      return Object.assign({}, f, { color: f.active ? '#EAF6FC' : '#CFE6F2', bg: f.active ? 'rgba(34,211,238,0.12)' : 'transparent' });
    });
    var places = [
      { name: 'Disco do sistema', note: '212 GB', icon: DISK },
      { name: 'Pendrive Terminus', note: '32 GB', icon: USB },
      { name: 'Windows', note: 'partição', icon: WIN }
    ];
    var raw = [
      { name: 'Meu jogo', meta: 'Projeto Unity', icon: CUBE, kind: 'proj', selected: true },
      { name: 'Protótipo VR', meta: 'Projeto Unity', icon: CUBE, kind: 'proj' },
      { name: 'Assets', meta: '48 itens', icon: FOLDER, kind: 'folder' },
      { name: 'Áudio', meta: '23 itens', icon: FOLDER, kind: 'folder' },
      { name: 'Builds', meta: '6 itens', icon: FOLDER, kind: 'folder' },
      { name: 'Texturas', meta: '112 itens', icon: FOLDER, kind: 'folder' },
      { name: 'musica-tema.ogg', meta: '4,2 MB', icon: AUDIO, kind: 'file' },
      { name: 'capa-loja.png', meta: '1,8 MB', icon: IMG, kind: 'file' },
      { name: 'roteiro.md', meta: '12 KB', icon: DOC, kind: 'file' },
      { name: 'notas-build.txt', meta: '3 KB', icon: DOC, kind: 'file' }
    ];
    var items = raw.map(function (r) {
      var tint = r.kind === 'proj' ? '#22D3EE' : (r.kind === 'folder' ? '#5B9BFF' : '#A9C7DA');
      var iconBg = r.kind === 'file' ? 'rgba(255,255,255,0.05)' : (r.kind === 'proj' ? 'rgba(34,211,238,0.12)' : 'rgba(91,155,255,0.12)');
      return Object.assign({}, r, {
        tint: tint, iconBg: iconBg,
        border: r.selected ? 'rgba(34,211,238,0.6)' : 'transparent',
        bg: r.selected ? 'rgba(34,211,238,0.10)' : 'transparent'
      });
    });
    return { fav: fav, places: places, items: items };
  }
}
</script>
</body>
</html>
