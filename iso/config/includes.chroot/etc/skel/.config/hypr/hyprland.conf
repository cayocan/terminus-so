# Terminus SO — configuração base do Hyprland
# Este arquivo é da camada base. Mudanças pessoais vão em ~/.config/hypr/pessoal.conf.

monitor = , preferred, auto, 1

exec-once = quickshell -p /usr/share/terminus/shell
exec-once = systemctl --user start hyprpolkitagent

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland

input {
    kb_layout = br
    follow_mouse = 1
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(22d3eeaa)
    col.inactive_border = rgba(9cc9e022)
    layout = dwindle
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = suave, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, suave, popin 85%
    animation = fade, 1, 5, suave
    animation = workspaces, 1, 5, suave, slide
}

# Janelas soltas, como no Windows e no Mac.
# Conferir a sintaxe de regras de janela na versão do Hyprland instalada (ROADMAP, fase 1).
windowrule = float, class:.*

$mod = SUPER

bind = $mod, RETURN, exec, foot
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

source = ~/.config/hypr/pessoal.conf
